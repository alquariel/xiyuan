MOC:CFG_1.0::
# MECHANICAL_UNIT - ?
MECHANICAL_UNIT:
# 
-name "STN1" -use_activation_relay "" -use_brake_relay ""\
      -use_robot "STN1" -allow_move_of_user_frame  -activate_at_start_up \
      -deactivation_forbidden  
      
-name "Track" -use_activation_relay "" -use_activation_relay "" -use_brake_relay ""\
      -use_single_0 "M7" -allow_move_of_user_frame  -activate_at_start_up \
      -deactivation_forbidden 

# RELAY - ?
    
# ROBOT-?
ROBOT:
#   
-name "STN1" -use_robot_type "STN1" -use_joint_0 "M8"\
-use_joint_1 "M9" -use_joint_jog "STN1"   
      
# ROBOT_TYPE-?
ROBOT_TYPE:
#
-name "STN1" -type "IRBP_A" -error_model "ERROR" -no_of_joints 2  
      
# JOINT_JOG-?
JOINT_JOG:
#
-name "STN1" -joint_1 1 -joint_2 2            

# SINGLE - ?
SINGLE:
#
-name "M7" -use_single_type "M7" -use_joint "M7"

-name "M8" -use_single_type "M8" -use_joint "M8"
      
-name "M9" -use_single_type "M9" -use_joint "M9"
      
     
# SINGLE_TYPE- ?
