-board_position 1 -measurement_node 1 
#
-name "M8" -use_measurement_board_type "DSQC313" -measurement_link 2 \
-board_position 1 -measurement_node 2 
#
-name "M9" -use_measurement_board_type "DSQC313" -measurement_link 2 \
-board_position 1 -measurement_node 3

# ARM - ?
ARM:
#
-name "M7" -use_arm_type "M7" -use_acc_data "M7" -upper_joint_bound 1256637 \
-lower_joint_bound -1256637 
#
-name "M8" -use_arm_type "M8" -use_acc_data "M8" -upper_joint_bound 1256637 \
-lower_joint_bound -1256637 
#
-name "M9" -use_arm_type "M9" -use_acc_data "M9" -upper_joint_bound 1256637 \
-lower_joint_bound -1256637 

# ARM_TYPE - Type of arm
