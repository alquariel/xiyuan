#

-name "M7" -mechanics "TRACK"

-name "M8" -mechanics "FREE_ROT"
      
-name "M9" -mechanics "FREE_ROT" 

# JOINT - ?
JOINT:
#
-name "M7" -logical_axis 7 -use_measurement_channel "M7" -use_axc_filter "M7" \
-use_arm "M7" -use_transmission "M7" -use_brake "M7" -use_supervision "M7" \
-use_drive_system "M7" -drive_module 1 -use_drive_module "drive_module_1" \
-uncalibrated_control_master_type "UCCM0" \
-use_uncalibrated_control_master "M7" -normal_control_master_type "LCM0" \
-use_normal_control_master "M7"      
#
-name "M8" -logical_axis 8 -use_measurement_channel "M8" \
-use_axc_filter "M8" -use_arm "M8" -use_transmission "M8" -use_brake "M8" \
-use_supervision "M8" -use_drive_system "M8" -drive_module 1 \
-use_drive_module "drive_module_1" -uncalibrated_control_master_type "UCCM0" \
-use_uncalibrated_control_master "M8" -normal_control_master_type "LCM0" \
-use_normal_control_master "M8" 
#
-name "M9" -logical_axis 9 -use_measurement_channel "M9" \
-use_axc_filter "M9" -use_arm "M9" -use_transmission "M9" -use_brake "M9" \
-use_supervision "M9" -use_drive_system "M9" -drive_module 1 \
-use_drive_module "drive_module_1" -uncalibrated_control_master_type "UCCM0" \
-use_uncalibrated_control_master "M9" -normal_control_master_type "LCM0" \
