#
-name "M7" -wc_acc 1 -wc_dec 1 -wc_dacc_ratio 1 -wc_ddec_ratio 1 
#
-name "M8" -wc_acc 1 -wc_dec 1 -wc_dacc_ratio 1 -wc_ddec_ratio 1
